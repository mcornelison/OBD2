# ==============================================================================
# File:    eclipse-powerkey.conf
# Purpose: systemd-logind drop-in pinning the power key to poweroff
# Author:  Rex (Ralph Agent)
# Created: 2026-10-19 -- Sprint 106 US-649-f
#
# Why
# ---
# CIO 2026-10-16: the power key = a clean shutdown. logind's own default for
# HandlePowerKey is already poweroff, and Atlas measured 2026-10-19 that the Pi
# carries no inhibitor and no logind drop-in, so this file changes nothing
# today. It PINS that default, in both display modes, so a future package or
# desktop default cannot change the key's behaviour silently.
#
# The press goes logind -> poweroff. The load shed and splash-grace hang off
# powerwatch's key-off path, not the power key.
#
# Installation
# ------------
# Installed by deploy/deploy-pi.sh (step_install_logind_powerkey) as:
#   /etc/systemd/logind.conf.d/50-eclipse-powerkey.conf
# systemd-logind is never restarted by the deploy; the drop-in takes effect on
# the next boot.
# ==============================================================================

[Login]
HandlePowerKey=poweroff
