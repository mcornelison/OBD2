# ==============================================================================
# File:    eclipse-kiosk-vt.conf
# Purpose: systemd-logind drop-in that opens no text consoles on the panel
# Author:  Rex (Ralph Agent)
# Created: 2026-10-25 -- Sprint 115 US-652-c
#
# Why
# ---
# logind's defaults are NAutoVTs=6 / ReserveVT=6, so Ctrl+Alt+F2..F6 can raise
# a text login on the panel; Atlas measured the Pi carries no override (source:
# Atlas 2026-10-24 research section 4). CIO 2026-10-24 access ruling: no
# on-screen login, ever; SSH and the serial login stay the way in.
#
# Per logind.conf(5): NAutoVTs=0 stops logind spawning a getty when a VT is
# switched to, and ReserveVT=0 stops it reserving one VT with a permanent
# getty. Neither touches the serial console getty.
#
# Installation
# ------------
# Installed by deploy/deploy-pi.sh (step_install_logind_kiosk_vt) as:
#   /etc/systemd/logind.conf.d/51-eclipse-kiosk-vt.conf
# systemd-logind is never restarted by the deploy; the drop-in takes effect on
# the next boot.
# ==============================================================================

[Login]
NAutoVTs=0
ReserveVT=0
