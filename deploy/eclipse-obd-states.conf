# ==============================================================================
# File:    eclipse-obd-states.conf  ->  /etc/tmpfiles.d/eclipse-obd-states.conf
# Purpose: F-103 C-5 states-dir boot provisioning (Atlas 2026-06-29). Creates
#          /run/eclipse-obd/states/ at EVERY boot, owned non-root (mcornelison),
#          INDEPENDENT of any service start order.
# Author:  Ralph Agent (Rex)
# Created: 2026-06-29 -- Sprint 48 US-393 (F-103 boot splash)
#
# Why this file exists (the C-5 gap it closes):
#   /run is a tmpfs on Raspberry Pi OS -- wiped on every reboot. eclipse-obd.service
#   creates only /run/eclipse-obd (via RuntimeDirectory=eclipse-obd) on ITS OWN
#   start and removes it on stop, and it never creates the states/ subdir. The
#   old deploy-time `install -d` ran once and was wiped on the next reboot. So
#   neither covers "the dir exists at boot before/without eclipse-obd." A
#   tmpfiles.d entry is run by systemd-tmpfiles-setup early at boot, every boot,
#   regardless of unit ordering -- which is exactly the invariant the cold-reboot
#   bench drill proves (splash renders without eclipse-obd having provisioned it).
#
# Reconciliation with the units' RuntimeDirectory=eclipse-obd:
#   tmpfiles creates the dir at boot; the F-103 units additionally declare a
#   SHARED RuntimeDirectory=eclipse-obd so the dir is ref-counted and survives
#   eclipse-obd.service stop (US-394 shutdown-splash needs shutdown-state after
#   eclipse-obd has stopped). The two mechanisms are complementary, not fighting:
#   tmpfiles guarantees boot-time existence; the shared RuntimeDirectory ref-count
#   guarantees mid-session survival across eclipse-obd's lifecycle.
#
# Type 'd': create directory if absent, set mode+owner, do not delete contents.
# Columns: Type Path Mode User Group Age Argument
# ==============================================================================
d /run/eclipse-obd        0755 mcornelison mcornelison - -
d /run/eclipse-obd/states 0755 mcornelison mcornelison - -
