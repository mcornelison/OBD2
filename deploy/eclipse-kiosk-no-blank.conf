# /etc/X11/xorg.conf.d/10-eclipse-kiosk-no-blank.conf
#
# Eclipse OBD-II kiosk display: disable X11 screen blanking + DPMS so the 3.5"
# panel never sleeps and shows "no input".
#
# Why: the splash/dashboard chromium kiosk renders continuously but takes no
# input at idle (it's a status display, not interactive most of the time). X11's
# default screensaver (BlankTime 10min) + DPMS (Standby/Suspend/Off 10min) then
# switch the panel OUTPUT off -> the operator sees "no input" and thinks it
# crashed, when the kiosk is still running fine underneath.
#
# This drop-in disables all four timers at Xorg start, every boot -- more robust
# than an `xset` in a kiosk unit ExecStartPre (which only covers the kiosk's own
# lifetime and races the desktop session). Installed by deploy-pi.sh
# (step_install_ui_kiosk_units). Filed as Bug 4 of
# offices/architect/findings/2026-07-01-pi-display-blank-deploy-contract-gaps.md.
#
# 0 = disabled (never blank / never power-manage the display).

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
