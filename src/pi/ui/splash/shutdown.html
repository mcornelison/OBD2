<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=480, height=320, initial-scale=1, user-scalable=no"/>
<title>Eclipse OBD-II Shutdown Splash</title>
<!-- F-103 shutdown splash (US-396). Served same-origin by eclipse-states-http at
     http://127.0.0.1:9899/shutdown.html so the auth token is injected below (the
     token SSOT never lands on disk -- the HTTP server token-injects .html assets).
     D-1 fix: this embeds splash-shutdown.svg (the REVERSE dim-down animation), NOT
     splash.svg -- the prior kit loaded the forward boot animation here. -->
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <!-- Hidden until the first flushing (or powering_off) read (US-870-a): the
       sequencer's smoothing window is the one debounce, so during grace the
       dashboard stays up and a blip that ends in cancelled paints nothing. The
       page holds no timer of its own. -->
  <div id="splash-stage" style="visibility:hidden">
    <!-- Reverse 3-rhombus dim-down (spec §6 ANIMATING). -->
    <object id="mark" type="image/svg+xml" data="splash-shutdown.svg" aria-label="shutdown splash"></object>

    <!-- The progress bar + its two-line label (US-870-b, spec §2 / §2.2).
         shutdown-state-poll.js draws both from shutdown-state step{index, of,
         name} and nothing else: the fill is #bar-fill's width, the words are
         #label-1 / #label-2. Empty until a real step is read. US-883-c: at
         home sync{state, outcome, waitingAtKeyOff, confirmed} drives the
         0-75 % part and the drain's words; #bar-kept is the rows a sync
         that ended kept, drawn as an amber length up to the 75 % marker. -->
    <div id="progress">
      <div id="bar-track">
        <div id="bar-fill"></div>
        <div id="bar-kept"></div>
        <div class="bar-tick tick-0"></div>
        <div class="bar-tick tick-25"></div>
        <div class="bar-tick tick-50"></div>
        <div class="bar-tick tick-75"></div>
        <div class="bar-tick tick-100"></div>
        <div id="bar-marker"></div>
      </div>
      <div id="bar-ticks">
        <span class="bar-tick-label tick-0">0</span>
        <span class="bar-tick-label tick-25">25</span>
        <span class="bar-tick-label tick-50">50</span>
        <span class="bar-tick-label tick-75">75</span>
        <span class="bar-tick-label tick-100">100 %</span>
      </div>
      <div id="label-1"></div>
      <div id="label-2"></div>
    </div>

    <!-- HTML text overlays (absolute-positioned via styles.css). -->
    <div id="wordmark" class="overlay">ECLIPSE OBD-II<span id="warn-glyph"></span></div>
    <div id="version-chip" class="overlay">V?.?.?</div>
  </div>

  <script>
    // Token injected by the state server at serve time (token SSOT). When
    // previewed from file:// the placeholder stays as-is and the shutdown-state
    // polls fail closed -- the preview still renders the reverse animation.
    window.SPLASH_TOKEN = "__SPLASH_TOKEN__";
  </script>
  <script src="shutdown-state-poll.js"></script>
</body>
</html>
