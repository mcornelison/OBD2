<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Splash Preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1c; color: #ccc;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; min-height: 100vh; }
  body { display: flex; flex-direction: column; align-items: center; padding: 28px; gap: 24px; }
  h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: #888; margin: 0; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .card { background: #000; border: 1px solid #2a2a2e; border-radius: 4px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .card h2 { margin: 0; font-size: 11px; letter-spacing: 0.06em; color: #888; font-weight: 500;
    text-transform: uppercase; }
  .frame { width: 480px; height: 320px; background: #000; border-radius: 3px; overflow: hidden;
    position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
  .frame object { width: 100%; height: 100%; display: block; background: #000; }
  button { background: #2a2a2e; color: #ccc; border: 0; padding: 8px 14px; border-radius: 3px;
    cursor: pointer; font-family: inherit; font-size: 11px; letter-spacing: 0.06em; }
  button:hover { background: #3a3a3e; }
  p { max-width: 680px; line-height: 1.6; font-size: 12px; color: #888; }
</style>
</head>
<body>
  <h1>Splash Preview · 480×320 · 6.5s</h1>
  <p>Open this file in a regular browser (Chrome, Firefox, Safari) to see
     both the boot and shutdown animations. The animations are CSS-only
     inside each SVG — this page just embeds them at native 480×320 size
     and offers a Replay button per panel.</p>
  <div class="row">
    <div class="card">
      <h2>Boot</h2>
      <div class="frame"><object id="bootObj" type="image/svg+xml" data="splash.svg"></object></div>
      <button onclick="document.getElementById('bootObj').data = 'splash.svg?' + Date.now()">↻ Replay boot</button>
    </div>
    <div class="card">
      <h2>Shutdown</h2>
      <div class="frame"><object id="downObj" type="image/svg+xml" data="splash-shutdown.svg"></object></div>
      <button onclick="document.getElementById('downObj').data = 'splash-shutdown.svg?' + Date.now()">↻ Replay shutdown</button>
    </div>
  </div>
</body>
</html>
