<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid meet">
  <style><![CDATA[
    :root, svg {
      --red:        #E60012;
      --red-light:  #F61D2D;
      --red-dark:   #BF000F;
      --bright-low: 0.25;
      --bright-mid: 0.50;
      --bright-hi:  0.75;
      --bright-max: 1.00;
      --throb-low:  0.60;
      --spin-end:   -360deg;
      --t-spin:     3.0s;
      --t-fade:     0.5s;
    }

    .logo {
      transform-box: view-box;
      transform-origin: 240px 160px;
    }
    .logo {
      animation-name:            spin,        light,    fadeout;
      animation-duration:        3s,          4.5s,     0.5s;
      animation-timing-function: linear,      linear,   ease-in;
      animation-delay:           1.5s,        1.5s,     6s;
      animation-fill-mode:       both,        both,     both;
    }

    .dot {
      animation-name: dot;
      animation-duration: 0.6s;
      animation-timing-function: ease-out;
      animation-delay: 0s;
      animation-fill-mode: both;
    }

    .scaler {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .s-top {
      animation-name: bloom;
      animation-duration: 0.4s;
      animation-timing-function: ease-out;
      animation-delay: 0.30s;
      animation-fill-mode: both;
    }
    .s-side {
      animation-name: bloom;
      animation-duration: 0.8s;
      animation-timing-function: cubic-bezier(.2,.7,.3,1);
      animation-delay: 0.70s;
      animation-fill-mode: both;
    }

    @keyframes dot {
      0%   { opacity: 0; }
      50%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes bloom {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    @keyframes spin {
      0%     { transform: rotate(0deg);    animation-timing-function: ease-in-out; }
      33.33% { transform: rotate(-120deg); animation-timing-function: ease-in-out; }
      66.67% { transform: rotate(-240deg); animation-timing-function: ease-in-out; }
      100%   { transform: rotate(var(--spin-end)); }
    }
    @keyframes light {
      0%   { filter: brightness(var(--bright-low)) saturate(1); }
      22%  { filter: brightness(var(--bright-mid)) saturate(1); }
      44%  { filter: brightness(var(--bright-hi))  saturate(1); }
      66%  { filter: brightness(var(--bright-max)) saturate(1); animation-timing-function: ease-in-out; }
      72%  { filter: brightness(var(--throb-low))  saturate(var(--throb-low)); animation-timing-function: ease-in-out; }
      77%  { filter: brightness(var(--bright-max)) saturate(1); animation-timing-function: ease-in-out; }
      83%  { filter: brightness(var(--throb-low))  saturate(var(--throb-low)); animation-timing-function: ease-in-out; }
      88%  { filter: brightness(var(--bright-max)) saturate(1); animation-timing-function: ease-in-out; }
      94%  { filter: brightness(var(--throb-low))  saturate(var(--throb-low)); animation-timing-function: ease-in-out; }
      100% { filter: brightness(var(--bright-max)) saturate(1); }
    }
    @keyframes fadeout {
      from { opacity: 1; }
      to   { opacity: 0; }
    }
  ]]></style>
  <defs>
    <linearGradient id="g" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#F61D2D"/>
      <stop offset="50%"  stop-color="#E60012"/>
      <stop offset="100%" stop-color="#BF000F"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="480" height="320" fill="#000000"/>
  <g class="logo">
    <circle class="dot" cx="240" cy="160" r="4" fill="#E60012" opacity="0"/>
    <g class="scaler s-top">
      <path d="M240,150 L265,100 L240,50 L215,100 Z" fill="url(#g)"/>
    </g>
    <g transform="rotate(-120 240 160)">
      <g class="scaler s-side">
        <path d="M240,150 L265,100 L240,50 L215,100 Z" fill="url(#g)"/>
      </g>
    </g>
    <g transform="rotate(-240 240 160)">
      <g class="scaler s-side">
        <path d="M240,150 L265,100 L240,50 L215,100 Z" fill="url(#g)"/>
      </g>
    </g>
  </g>
</svg>
